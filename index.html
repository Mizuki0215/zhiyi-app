<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知亦 · 月</title>
<style>body{margin:0;background:#12081f;color:#fff;font-family:PingFang HK,sans-serif} .phone{max-width:420px;margin:12px auto;border:3px solid #49e7ff;min-height:90vh;display:flex;flex-direction:column;background:#1a1030} header,form,nav{padding:10px} .log{flex:1;overflow:auto;padding:10px} .me{text-align:right;color:#ff8ad4} .him{color:#bff} button,input{font:inherit} input{width:70%} </style></head>
<body><div class="phone"><header>傳知亦 · 酒會<small id="aff"> 好感 22</small></header><div class="log" id="log"></div><form id="f"><input id="q" placeholder="同傳知亦講"><button>送</button></form></div>
<script>
const log=document.getElementById('log'); const affEl=document.getElementById('aff'); let aff=22; const mem=[];
function add(who,t){const p=document.createElement('p'); p.className=who; p.textContent=t; log.appendChild(p); log.scrollTop=log.scrollHeight;}
add('him','……月。一年。英國嘅空氣，睇落幾適合你。');
document.getElementById('f').onsubmit=e=>{e.preventDefault(); const t=q.value.trim(); if(!t)return; q.value=''; add('me',t); if(/病|痛|走|騙|積木/.test(t)) mem.push(t); aff=Math.min(100,aff+1); affEl.textContent='好感 '+aff+(mem.length?' · 記住'+mem.length:''); add('him','（佢望住你。）'+t.slice(0,18)+'。我聽到。你再講。');};
</script></body></html>
